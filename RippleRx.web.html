<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RippleRx — Medication Adherence Risk Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182A2F;
    --ink-soft:#5A6C71;
    --paper:#EDEFE9;
    --surface:#FFFFFF;
    --line:#D7DCD1;
    --accent:#2F6E7A;
    --accent-soft:#DEEAEA;
    --risk-low:#4F7A57;
    --risk-low-bg:#E3EEE1;
    --risk-med:#B5792A;
    --risk-med-bg:#F5E7D2;
    --risk-high:#AE4636;
    --risk-high-bg:#F5DFD9;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  a{color:inherit;}
  .app{display:grid;grid-template-columns:300px 1fr;min-height:100vh;}
  /* Rail */
  .rail{background:var(--ink);color:#E9ECE6;padding:26px 20px;display:flex;flex-direction:column;gap:22px;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .wordmark{font-family:var(--font-display);font-size:26px;font-weight:500;}
  .brand .tagline{font-size:12.5px;color:#9FB4B8;}
  .summary{display:flex;flex-direction:column;gap:6px;border-top:1px solid #2C4249;border-bottom:1px solid #2C4249;padding:14px 0;}
  .summary-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;}
  .summary-row .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;}
  .filter select{width:100%;background:#1F343B;color:#E9ECE6;border:1px solid #33484F;padding:9px 10px;font-family:var(--font-body);font-size:13px;border-radius:4px;}
  .filter select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .patient-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin:0 -8px;}
  .patient-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent;background:none;text-align:left;width:100%;color:inherit;font-family:inherit;}
  .patient-row:hover{background:#1F343B;}
  .patient-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .patient-row.active{background:#25444C;border-color:var(--accent);}
  .patient-row .swatch{width:8px;align-self:stretch;border-radius:2px;flex-shrink:0;}
  .patient-row .info{flex:1;min-width:0;}
  .patient-row .pname{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .patient-row .pcond{font-size:11.5px;color:#9FB4B8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .patient-row .pscore{font-family:var(--font-display);font-size:17px;flex-shrink:0;}

  /* Detail pane */
  .detail{padding:40px 48px 60px;overflow-y:auto;}
  .detail-header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px;}
  .detail-header h1{font-family:var(--font-display);font-weight:500;font-size:30px;margin:0;}
  .detail-header .meta{color:var(--ink-soft);font-size:14px;margin-top:4px;}
  .detail-header .updated{font-size:12.5px;color:var(--ink-soft);}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);padding:16px 18px;}
  .stat-card .label{font-size:12.5px;color:var(--ink-soft);}
  .stat-card .value{font-family:var(--font-display);font-size:28px;margin-top:6px;display:flex;align-items:baseline;gap:8px;}
  .stat-card .value .unit{font-family:var(--font-body);font-size:13px;color:var(--ink-soft);}
  .band-pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;margin-top:6px;}

  .section-title{font-family:var(--font-display);font-size:18px;font-weight:500;margin:0 0 14px;}
  .signals{display:flex;flex-direction:column;gap:16px;margin-bottom:30px;}
  .signal-row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:14px;}
  .signal-row .slabel{font-size:13.5px;color:var(--ink-soft);}
  .bars{display:flex;align-items:flex-end;gap:5px;height:38px;}
  .bars .bar{width:11px;border-radius:2px 2px 0 0;min-height:2px;}
  .dots{display:flex;gap:7px;align-items:center;height:38px;}
  .dots .d{width:12px;height:12px;border-radius:50%;border:2px solid var(--risk-high);}
  .dots .d.attended{background:transparent;border-color:var(--line);}
  .dots .d.missed{background:var(--risk-high);}

  .assessment{background:var(--surface);border-left:4px solid var(--accent);padding:20px 24px;margin-bottom:18px;}
  .assessment h2{font-family:var(--font-display);font-size:17px;font-weight:500;margin:0 0 8px;}
  .assessment p{margin:0;line-height:1.6;font-size:14.5px;}

  .next-step{background:var(--accent-soft);border:1px solid var(--accent);padding:16px 22px;margin-bottom:10px;}
  .next-step .k{font-size:12.5px;color:var(--accent);font-weight:600;margin-bottom:4px;}
  .next-step p{margin:0;line-height:1.55;font-size:14.5px;}

  .disclaimer{margin-top:42px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);line-height:1.6;max-width:70ch;}

  @media (max-width: 860px){
    .app{grid-template-columns:1fr;}
    .rail{flex-direction:column;}
    .patient-list{max-height:260px;}
    .detail{padding:28px 22px 50px;}
    .stat-row{grid-template-columns:1fr 1fr;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="wordmark">RippleRx</span>
      <span class="tagline">Medication adherence risk radar</span>
    </div>
    <div class="summary" id="summary"></div>
    <div class="filter">
      <select id="conditionFilter" aria-label="Filter by condition"></select>
    </div>
    <nav class="patient-list" id="patientList" aria-label="Patient list"></nav>
  </aside>
  <main class="detail" id="detail"></main>
</div>

<script>
// ---------- Mock data (synthetic, for demo purposes only) ----------
// Each array covers the last 8 weeks, oldest to most recent.
const patients = [
  {id:1, name:"Anita Rao", age:58, condition:"Hypertension",
   refillGap:[2,1,3,2,10,14,16,18], symptom:[1,1,2,1,3,5,6,7],
   activity:[2,0,-3,1,-10,-18,-25,-30], apptMissed:[false,false,false,false,false,true,false,true]},
  {id:2, name:"Rajesh Kumar", age:45, condition:"Type 2 Diabetes",
   refillGap:[1,2,1,0,1,9,2,1], symptom:[2,2,1,2,2,4,2,1],
   activity:[0,2,1,0,-2,-15,3,4], apptMissed:[false,false,false,false,false,false,false,false]},
  {id:3, name:"Meena Iyer", age:67, condition:"Post-MI Cardiac Care",
   refillGap:[0,1,0,1,0,1,6,9], symptom:[1,1,1,2,1,2,4,5],
   activity:[1,0,2,1,0,-1,-9,-14], apptMissed:[false,false,false,false,false,false,false,false]},
  {id:4, name:"Farhan Sheikh", age:34, condition:"Tuberculosis (DOTS)",
   refillGap:[0,0,1,0,0,0,1,0], symptom:[1,2,3,4,5,6,7,8],
   activity:[2,3,1,2,0,1,-2,-3], apptMissed:[false,false,false,true,false,true,false,true]},
  {id:5, name:"Priya Nair", age:52, condition:"Hypertension",
   refillGap:[0,1,0,0,1,0,0,1], symptom:[1,0,1,0,1,0,1,0],
   activity:[1,2,0,1,2,1,0,1], apptMissed:[false,false,false,false,false,false,false,false]},
  {id:6, name:"Suresh Pillai", age:71, condition:"Type 2 Diabetes + Hypertension",
   refillGap:[3,4,5,7,9,11,13,15], symptom:[2,3,3,4,5,5,6,7],
   activity:[-2,-4,-5,-8,-12,-15,-18,-20], apptMissed:[false,false,true,false,true,false,true,true]},
  {id:7, name:"Kavya Menon", age:29, condition:"Gestational Diabetes (postpartum)",
   refillGap:[0,0,1,0,0,1,0,0], symptom:[0,1,0,0,1,0,0,0],
   activity:[1,0,1,2,0,1,0,1], apptMissed:[false,false,false,false,false,false,false,false]}
];

// ---------- Explainable scoring engine ----------
// Weights are intentionally transparent and easy to justify out loud:
// refill timing 0.35, symptom trend 0.30, activity change 0.20, attendance 0.15
function avg(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }

function analyze(p){
  const composites = [];
  for(let i=0;i<8;i++){
    const refillN = Math.min(p.refillGap[i]/14,1);
    const symptomN = Math.min(p.symptom[i]/8,1);
    const activityN = Math.min(Math.max(-p.activity[i],0)/25,1);
    const apptN = p.apptMissed[i] ? 1 : 0;
    composites.push(100*(0.35*refillN+0.30*symptomN+0.20*activityN+0.15*apptN));
  }
  const last3 = a=>a.slice(-3);
  const refillAvg3 = avg(last3(p.refillGap));
  const symptomAvg3 = avg(last3(p.symptom));
  const activityAvg3 = avg(last3(p.activity));
  const apptMissedLast4 = p.apptMissed.slice(-4).filter(Boolean).length;

  const refillN = Math.min(refillAvg3/14,1);
  const symptomN = Math.min(symptomAvg3/8,1);
  const activityN = Math.min(Math.max(-activityAvg3,0)/25,1);
  const apptN = apptMissedLast4/4;

  const score = Math.round(100*(0.35*refillN+0.30*symptomN+0.20*activityN+0.15*apptN));
  const band = score>=65 ? 'High' : score>=35 ? 'Medium' : 'Low';

  const last3c = composites.slice(-3);
  const prior5c = composites.slice(0,5);
  const recentAvg = avg(last3c);
  const priorAvg = avg(prior5c);
  const riseCount = last3c.filter(c=>c>=40).length;

  let pattern;
  if (riseCount>=1 && (recentAvg-priorAvg)>=15){
    const strongRecent = composites.slice(-5).filter(c=>c>=40).length;
    pattern = strongRecent>=4 ? 'Sustained' : 'Emerging';
  } else if (composites.filter(c=>c>=40).length===1){
    pattern = 'Temporary blip';
  } else if (composites.every(c=>c<25)){
    pattern = 'Stable';
  } else {
    pattern = 'Intermittent';
  }

  const elevatedSignals = [refillN,symptomN,activityN,apptN].filter(v=>v>0.4).length;
  const confidence = elevatedSignals>=3 ? 'High' : elevatedSignals===2 ? 'Medium' : 'Low';

  // Explanation clauses, generated from the actual numbers (not canned per patient)
  const clauses = [];
  if (refillN>0.25) clauses.push(`refills have run about ${Math.round(refillAvg3)} days late on average over the last 3 cycles`);
  if (symptomN>0.25) clauses.push(`follow-up notes show rising symptom severity (avg ${symptomAvg3.toFixed(1)}/10 across recent visits)`);
  if (activityN>0.25) clauses.push(`wearable activity is down about ${Math.abs(Math.round(activityAvg3))}% versus this patient's baseline`);
  if (apptN>0.25) clauses.push(`${apptMissedLast4} of the last 4 scheduled appointments were missed`);

  let explanation;
  if (clauses.length===0){
    explanation = `Refills, symptom reports, activity, and attendance are all close to this patient's normal range. No meaningful deviation detected.`;
  } else {
    explanation = clauses.join('; ');
    explanation = explanation.charAt(0).toUpperCase()+explanation.slice(1)+'.';
  }

  const confidenceNote = confidence==='High'
    ? 'Multiple independent signals point the same way.'
    : confidence==='Medium'
    ? 'Some signals agree; others are inconclusive on their own.'
    : 'Only one signal stands out — treat this as a hint to investigate, not a conclusion.';

  let nextStep;
  if (confidence==='Low' && band!=='Low'){
    nextStep = 'Signals do not fully agree with each other. Recommend a direct check-in call rather than acting on this score alone.';
  } else if (pattern==='Sustained' && band==='High'){
    nextStep = 'Recommend care-team outreach and a medication review within the week.';
  } else if (pattern==='Emerging'){
    nextStep = 'Flag for the next scheduled follow-up and re-check in 1–2 weeks before escalating further.';
  } else if (pattern==='Temporary blip'){
    nextStep = 'This looks like an isolated, already-resolved deviation. Log it for the record — no immediate action needed.';
  } else if (band==='Low'){
    nextStep = 'No action needed. Continue routine monitoring.';
  } else {
    nextStep = 'Monitor closely and re-assess at the next data update.';
  }

  return {...p, score, band, pattern, confidence, confidenceNote, composites, explanation, nextStep,
           refillAvg3, symptomAvg3, activityAvg3, apptMissedLast4};
}

const analyzed = patients.map(analyze).sort((a,b)=>b.score-a.score);
let selectedId = analyzed[0].id;
let activeCondition = 'All conditions';

const bandColor = { High:'var(--risk-high)', Medium:'var(--risk-med)', Low:'var(--risk-low)' };
const bandBg = { High:'var(--risk-high-bg)', Medium:'var(--risk-med-bg)', Low:'var(--risk-low-bg)' };
const confColor = { High:'var(--accent)', Medium:'#8A7A3F', Low:'var(--ink-soft)' };

function renderSummary(){
  const counts = {High:0, Medium:0, Low:0};
  analyzed.forEach(p=>counts[p.band]++);
  const el = document.getElementById('summary');
  el.innerHTML = `
    <div class="summary-row"><span><span class="dot" style="background:${bandColor.High}"></span>High risk</span><span>${counts.High}</span></div>
    <div class="summary-row"><span><span class="dot" style="background:${bandColor.Medium}"></span>Medium risk</span><span>${counts.Medium}</span></div>
    <div class="summary-row"><span><span class="dot" style="background:${bandColor.Low}"></span>Low risk</span><span>${counts.Low}</span></div>
  `;
}

function renderFilter(){
  const conditions = ['All conditions', ...new Set(analyzed.map(p=>p.condition))];
  const el = document.getElementById('conditionFilter');
  el.innerHTML = conditions.map(c=>`<option value="${c}">${c}</option>`).join('');
  el.value = activeCondition;
  el.onchange = (e)=>{ activeCondition = e.target.value; renderList(); };
}

function renderList(){
  const el = document.getElementById('patientList');
  const visible = analyzed.filter(p=>activeCondition==='All conditions' || p.condition===activeCondition);
  el.innerHTML = visible.map(p=>`
    <button class="patient-row ${p.id===selectedId?'active':''}" onclick="selectPatient(${p.id})">
      <span class="swatch" style="background:${bandColor[p.band]}"></span>
      <span class="info">
        <div class="pname">${p.name}</div>
        <div class="pcond">${p.condition}</div>
      </span>
      <span class="pscore" style="color:${bandColor[p.band]}">${p.score}</span>
    </button>
  `).join('');
}

function bar(v, max, color){
  const h = Math.max(4, Math.min(Math.abs(v)/max,1)*38);
  return `<div class="bar" style="height:${h}px;background:${color}" title="${v}"></div>`;
}

function refillColor(v){ return v>=10?'var(--risk-high)': v>=5?'var(--risk-med)':'var(--accent)'; }
function symptomColor(v){ return v>=6?'var(--risk-high)': v>=3?'var(--risk-med)':'var(--accent)'; }
function activityColor(v){ return v<=-15?'var(--risk-high)': v<=-5?'var(--risk-med)':'var(--accent)'; }

function renderDetail(){
  const p = analyzed.find(x=>x.id===selectedId);
  const el = document.getElementById('detail');
  el.innerHTML = `
    <div class="detail-header">
      <div>
        <h1>${p.name}</h1>
        <div class="meta">${p.age} years · ${p.condition}</div>
      </div>
      <div class="updated">Last data update: this week</div>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="label">Risk score</div>
        <div class="value" style="color:${bandColor[p.band]}">${p.score}<span class="unit">/100</span></div>
        <span class="band-pill" style="background:${bandBg[p.band]};color:${bandColor[p.band]}">${p.band} risk</span>
      </div>
      <div class="stat-card">
        <div class="label">Pattern</div>
        <div class="value">${p.pattern}</div>
      </div>
      <div class="stat-card">
        <div class="label">Confidence</div>
        <div class="value" style="color:${confColor[p.confidence]}">${p.confidence}</div>
      </div>
    </div>

    <div class="section-title">Signals, last 8 weeks</div>
    <div class="signals">
      <div class="signal-row">
        <div class="slabel">Refill timing</div>
        <div class="bars">${p.refillGap.map(v=>bar(v,20,refillColor(v))).join('')}</div>
      </div>
      <div class="signal-row">
        <div class="slabel">Symptom severity</div>
        <div class="bars">${p.symptom.map(v=>bar(v,10,symptomColor(v))).join('')}</div>
      </div>
      <div class="signal-row">
        <div class="slabel">Activity vs baseline</div>
        <div class="bars">${p.activity.map(v=>bar(v,30,activityColor(v))).join('')}</div>
      </div>
      <div class="signal-row">
        <div class="slabel">Appointments</div>
        <div class="dots">${p.apptMissed.map(m=>`<span class="d ${m?'missed':'attended'}" title="${m?'Missed':'Attended'}"></span>`).join('')}</div>
      </div>
    </div>

    <div class="assessment">
      <h2>Assessment</h2>
      <p>${p.explanation} Over the observed period this reads as <strong>${p.pattern.toLowerCase()}</strong>, with <strong>${p.confidence.toLowerCase()} confidence</strong> — ${p.confidenceNote}</p>
    </div>

    <div class="next-step">
      <div class="k">Suggested next step</div>
      <p>${p.nextStep}</p>
    </div>

    <div class="disclaimer">
      Demo built on synthetic data to illustrate the concept. The score combines four routinely available signals — refill timing, follow-up note severity, wearable activity, and appointment attendance — using transparent, adjustable weights rather than a black-box model. A real deployment would run on de-identified, consented data with a clinician making the final call, not the system.
    </div>
  `;
}

function selectPatient(id){
  selectedId = id;
  renderList();
  renderDetail();
}

renderSummary();
renderFilter();
renderList();
renderDetail();
</script>
</body>
</html>
